<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Web Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            background-color: #1f2937;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 24px;
            width: 340px;
        }

        .display {
            background-color: #111827;
            border-radius: 8px;
            color: #f9fafb;
            font-size: 2rem;
            font-weight: 600;
            min-height: 70px;
            padding: 16px;
            text-align: right;
            word-wrap: break-word;
            word-break: break-all;
            margin-bottom: 20px;
            border: 1px solid #374151;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            background-color: #374151;
            border: none;
            border-radius: 8px;
            color: #f3f4f6;
            cursor: pointer;
            font-size: 1.25rem;
            font-weight: 600;
            height: 60px;
            transition: all 0.15s ease-in-out;
        }

        button:hover {
            background-color: #4b5563;
        }

        button:active {
            transform: scale(0.96);
        }

        button.operator {
            background-color: #f59e0b;
            color: #111827;
        }

        button.operator:hover {
            background-color: #d97706;
        }

        button.clear {
            background-color: #ef4444;
            color: #ffffff;
        }

        button.clear:hover {
            background-color: #dc2626;
        }

        button.equals {
            background-color: #10b981;
            color: #ffffff;
            grid-column: span 1;
        }

        button.equals:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendChar('(')">(</button>
            <button onclick="appendChar(')')">)</button>
            <button class="operator" onclick="appendChar('/')">/</button>

            <button onclick="appendChar('7')">7</button>
            <button onclick="appendChar('8')">8</button>
            <button onclick="appendChar('9')">9</button>
            <button class="operator" onclick="appendChar('*')">*</button>

            <button onclick="appendChar('4')">4</button>
            <button onclick="appendChar('5')">5</button>
            <button onclick="appendChar('6')">6</button>
            <button class="operator" onclick="appendChar('-')">-</button>

            <button onclick="appendChar('1')">1</button>
            <button onclick="appendChar('2')">2</button>
            <button onclick="appendChar('3')">3</button>
            <button class="operator" onclick="appendChar('+')">+</button>

            <button onclick="appendChar('0')">0</button>
            <button onclick="appendChar('.')">.</button>
            <button onclick="backspace()">⌫</button>
            <button class="equals" onclick="calculateResult()">=</button>
        </div>
    </div>

    <script>
        let currentExpression = "";

        function updateDisplay(value) {
            document.getElementById('display').innerText = value || "0";
        }

        function appendChar(char) {
            currentExpression += char;
            updateDisplay(currentExpression);
        }

        function clearDisplay() {
            currentExpression = "";
            updateDisplay("0");
        }

        function backspace() {
            currentExpression = currentExpression.slice(0, -1);
            updateDisplay(currentExpression);
        }

        async function calculateResult() {
            if (!currentExpression) return;

            try {
                const response = await fetch('/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ expression: currentExpression })
                });

                const data = await response.json();
                currentExpression = data.result.startsWith("Error") ? "" : data.result;
                updateDisplay(data.result);
            } catch (error) {
                updateDisplay("Error");
                currentExpression = "";
            }
        }
    </script>
</body>
</html>
